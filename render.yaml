# Render Blueprint: New → Blueprint → pick this repo.
# Creates Postgres, the web app, and a cron job that keeps PayPal in sync.
# Fill in the `sync: false` secrets when Render asks. With none of them set,
# Tend still runs, in its labelled demo mode.
#
# Paid plans, so the demo is always awake and keeps its history through
# judging: a Starter web service (never sleeps) and a Basic database (doesn't
# expire). To run it free instead, set both plans to `free` and delete the
# cron job: a free web service sleeps after 15 minutes idle, and free Postgres
# expires after 30 days. If the database ever stops answering, Tend falls back
# to its embedded database and reseeds the demo (see /api/health).
#
# No APP_URL needed: Render sets RENDER_EXTERNAL_URL, which Tend uses for
# invite links and PayPal return URLs. When pasting a laptop .env into the
# Environment tab, leave out APP_URL, DATABASE_URL and CRON_SECRET.

databases:
  - name: tend-db
    plan: basic-256mb

services:
  - type: web
    name: tend
    runtime: node
    plan: starter
    # --include=dev: the build needs Tailwind and TypeScript, and the seed runs on tsx.
    buildCommand: npm ci --include=dev && npm run build
    # Seeds the demo circle on first boot (no-op if it already exists).
    startCommand: npm run db:seed && npm start
    # Checks the database answers and a care circle exists.
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tend-db
          property: connectionString
      - key: CRON_SECRET
        generateValue: true
      - key: TEND_SESSION_SECRET
        generateValue: true
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # The AI model: set one of these two (TEND_MODEL picks the model).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: AG_GRID_LICENSE_KEY
        sync: false
      - key: CURRENCY
        value: USD
      # Keep the "Reset the demo" button for judges; set to 0 to hide it.
      - key: TEND_ALLOW_RESET
        value: "1"
      # Optional bearer token for /api/mcp. Leave empty so judges can connect
      # to the sandbox demo; live PayPal refuses MCP without one.
      - key: TEND_MCP_TOKEN
        sync: false
      - key: SANDBOX_PHARMACY_EMAIL
        sync: false
      - key: SANDBOX_CARER_EMAIL
        sync: false
      - key: SANDBOX_TAXI_EMAIL
        sync: false
      - key: SANDBOX_SHOP_EMAIL
        sync: false
      - key: SANDBOX_ROOFER_EMAIL
        sync: false
      - key: SANDBOX_ADA_EMAIL
        sync: false
      - key: SANDBOX_TUNDE_EMAIL
        sync: false
      - key: SANDBOX_CHIOMA_EMAIL
        sync: false
      - key: SANDBOX_MUM_EMAIL
        sync: false
      - key: SANDBOX_WALTER_EMAIL
        sync: false
      - key: SANDBOX_PRIYA_EMAIL
        sync: false
      - key: SANDBOX_DOLORES_EMAIL
        sync: false

  # Webhooks are the fast path; this is the safety net. Every five minutes it
  # asks Tend to settle payouts still "paying" and invoices PayPal marked paid.
  # Render cron jobs are a paid service type: delete this block to stay free.
  - type: cron
    name: tend-paypal-sync
    runtime: node
    plan: starter
    schedule: "*/5 * * * *"
    buildCommand: "true"
    # Over Render's private network: `hostport` is the web service's internal
    # name and port (e.g. tend-abcd:10000), which only answers plain http.
    startCommand: 'curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "http://$TEND_HOSTPORT/api/sync"'
    envVars:
      - key: CRON_SECRET
        fromService:
          name: tend
          type: web
          envVarKey: CRON_SECRET
      - key: TEND_HOSTPORT
        fromService:
          name: tend
          type: web
          property: hostport
